<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0F172A">
  <title>Arena | Kanji Battle</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Noto+Sans+JP:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <style>
    html, body { height: 100%; }
    body { font-family: 'Inter', sans-serif; background: #0F172A; color: #fff; overflow: hidden; touch-action: manipulation; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
    .jp { font-family: 'Noto Sans JP', sans-serif; }

    .app { height: 100vh; height: 100dvh; max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; background: #0F172A; position: relative;
      padding-top: env(safe-area-inset-top); padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right); }

    /* HEADER */
    .topbar { padding: 10px 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; background: rgba(15,23,42,.95); border-bottom: 1px solid #1E293B; flex-shrink: 0; }
    .pbox { display: flex; align-items: center; gap: 8px; width: 42%; min-width: 0; }
    .pbox.right { flex-direction: row-reverse; text-align: right; }
    .pavatar { width: clamp(34px, 10vw, 44px); height: clamp(34px, 10vw, 44px); border-radius: 9999px; border: 2px solid #475569; object-fit: cover; flex-shrink: 0; }
    .pname { font-size: 10px; font-weight: 700; color: #94A3B8; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hp-heart { font-size: clamp(11px, 3.2vw, 14px); color: #EF4444; margin: 0 1px; }
    .hp-heart.lost { color: #1E293B; }
    .pexp { font-size: 10px; font-weight: 700; color: #4ADE80; margin-top: 1px; }
    .vs { font-size: clamp(16px, 5vw, 22px); font-weight: 900; font-style: italic; color: #FBBF24; flex-shrink: 0; }

    /* ARENA */
    .arena { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 12px 16px; position: relative; }
    .arena::before { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(30,64,175,.1), rgba(127,29,29,.1)); pointer-events: none; }
    .pill { font-size: 11px; font-weight: 900; letter-spacing: .12em; color: #94A3B8; background: rgba(30,41,59,.85); border: 1px solid #334155; padding: 5px 14px; border-radius: 9999px; text-transform: uppercase; margin-bottom: clamp(10px, 3vh, 24px); position: relative; }
    .kanji { font-size: clamp(52px, 19vw, 96px); font-weight: 900; line-height: 1.1; text-align: center; width: 100%; overflow-wrap: anywhere; word-break: break-all; text-shadow: 0 0 30px rgba(255,255,255,.2); position: relative; }
    .qcount { position: relative; margin-top: clamp(8px, 2vh, 16px); font-size: 12px; font-weight: 700; color: #64748B; }

    @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
    .shake-anim { animation: shake .3s ease-in-out; }

    /* TIMER */
    .timer-wrap { height: 8px; background: #1E293B; flex-shrink: 0; }
    .timer-bar { height: 100%; width: 100%; background: linear-gradient(to right, #FACC15, #EF4444); transition: width 1s linear; }

    /* OPTIONS */
    .options { padding: 12px 12px calc(14px + env(safe-area-inset-bottom)); background: #0F172A; flex-shrink: 0; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(8px, 2.5vw, 12px); }
    .btn-option { background: #1E293B; border: 2px solid #334155; border-radius: 18px; color: #fff; font-weight: 700;
      min-height: clamp(56px, 11vh, 84px); padding: 8px 10px; font-size: clamp(16px, 4.8vw, 22px); line-height: 1.2; overflow-wrap: anywhere; display: flex; align-items: center; justify-content: center; text-align: center; transition: transform .12s, background .12s; }
    .btn-option:active:not(:disabled) { transform: scale(.96); background: #334155; }
    .btn-correct { background: #10B981 !important; border-color: #059669 !important; box-shadow: 0 0 22px rgba(16,185,129,.5); }
    .btn-wrong { background: #EF4444 !important; border-color: #B91C1C !important; box-shadow: 0 0 22px rgba(239,68,68,.5); }

    /* OVERLAYS */
    .overlay { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.92); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center;
      padding-bottom: calc(24px + env(safe-area-inset-bottom)); padding-top: calc(24px + env(safe-area-inset-top)); }
    .overlay.hidden { display: none; }
    .ov-inner { width: 100%; max-width: 420px; }
    .title-red { font-size: clamp(34px, 11vw, 52px); font-weight: 900; text-transform: uppercase; letter-spacing: .1em; background: linear-gradient(to bottom, #F87171, #B91C1C); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 20px; }
    .btn-big { width: 100%; min-height: 56px; border-radius: 18px; font-weight: 900; font-size: 18px; }
    .btn-white { background: #fff; color: #0F172A; }
    .btn-dark { background: #1E293B; color: #94A3B8; }
    .btn-white:active, .btn-dark:active { transform: scale(.97); }

    /* TOAST JAWABAN */
    .toast { position: fixed; z-index: 70; left: 50%; top: calc(76px + env(safe-area-inset-top)); transform: translateX(-50%); width: min(92vw, 380px); padding: 10px 14px; border-radius: 16px; background: rgba(15,23,42,.96); border: 2px solid #334155; box-shadow: 0 10px 30px rgba(0,0,0,.5); animation: toastIn .22s ease-out; text-align: left; }
    .toast.hidden { display: none; }
    .toast.ok { border-color: #10B981; } .toast.bad { border-color: #EF4444; } .toast.time { border-color: #F59E0B; }
    .toast .t-title { font-size: 11px; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; }
    .toast.ok .t-title { color: #34D399; } .toast.bad .t-title { color: #F87171; } .toast.time .t-title { color: #FBBF24; }
    .toast .t-kanji { font-size: 26px; font-weight: 900; line-height: 1.15; }
    .toast .t-read { font-size: 15px; font-weight: 700; color: #FDE68A; margin-left: 8px; }
    .toast .t-mean { font-size: 13px; color: #CBD5E1; margin-top: 2px; }
    .toast .t-pick { font-size: 11px; color: #94A3B8; margin-top: 3px; }
    @keyframes toastIn { from { opacity: 0; transform: translate(-50%, -10px); } to { opacity: 1; transform: translate(-50%, 0); } }

    /* TOMBOL STATISTIK */
    .btn-stats { position: absolute; top: 10px; right: 12px; z-index: 5; width: 40px; height: 40px; border-radius: 9999px; background: rgba(30,41,59,.9); border: 1px solid #334155; color: #FBBF24; font-size: 16px; }

    /* MODAL STATISTIK */
    .modal { position: fixed; inset: 0; z-index: 80; background: rgba(0,0,0,.75); display: flex; align-items: flex-end; justify-content: center; }
    .modal.hidden { display: none; }
    .sheet { width: 100%; max-width: 480px; max-height: 88dvh; background: #0F172A; border: 1px solid #334155; border-radius: 24px 24px 0 0; display: flex; flex-direction: column; padding: 14px 14px calc(14px + env(safe-area-inset-bottom)); }
    .sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-weight: 900; letter-spacing: .1em; }
    .lb-row { display: flex; align-items: center; gap: 10px; background: #1E293B; border-radius: 14px; padding: 8px 10px; margin-bottom: 6px; }
    .lb-row.me { border: 1px solid #FBBF24; }
    .lb-rank { width: 22px; font-weight: 900; text-align: center; }
    .lb-av { width: 34px; height: 34px; border-radius: 9999px; object-fit: cover; }
    .lb-stat { font-size: 11px; font-weight: 700; display: flex; gap: 8px; margin-top: 2px; }
    .tabs { display: flex; gap: 6px; margin: 8px 0; }
    .tab { flex: 1; padding: 8px; border-radius: 12px; background: #1E293B; color: #94A3B8; font-weight: 800; font-size: 12px; }
    .tab.active { background: #fff; color: #0F172A; }
    .hist-scroll { overflow-y: auto; flex: 1 1 auto; min-height: 120px; -webkit-overflow-scrolling: touch; overscroll-behavior: contain; }
    .h-item { background: #1E293B; border-left: 4px solid #10B981; border-radius: 12px; padding: 8px 10px; margin-bottom: 6px; text-align: left; }
    .h-item.bad { border-left-color: #EF4444; }
    .h-kanji { font-size: 20px; font-weight: 900; }
    .h-read { font-size: 13px; font-weight: 700; color: #FDE68A; margin-left: 6px; }
    .h-mean { font-size: 12px; color: #CBD5E1; }
    .h-pick { font-size: 11px; color: #F87171; margin-top: 2px; }
      .strip{display:flex;gap:6px;overflow-x:auto;padding:6px 10px;background:#0B1220;border-bottom:1px solid #1E293B;flex-shrink:0}
    .chip2{display:flex;align-items:center;gap:5px;background:#1E293B;border-radius:9999px;padding:3px 9px 3px 3px;font-size:11px;font-weight:800;white-space:nowrap;border:1px solid transparent}
    .chip2.me{border-color:#FBBF24}.chip2.dead{opacity:.45}
    .chip2 img{width:22px;height:22px;border-radius:9999px;object-fit:cover}
  </style>
</head>
<body>
<div class="app">

  <audio id="bgm" src="/backsound" loop preload="auto"></audio>
  <audio id="sfx-correct" src="https://cdn.pixabay.com/download/audio/2021/08/04/audio_0625c1539c.mp3" preload="auto"></audio>
  <audio id="sfx-wrong" src="https://cdn.pixabay.com/download/audio/2022/03/10/audio_c8c8a73467.mp3" preload="auto"></audio>

  <!-- TOP BAR -->
  <header class="topbar">
    <div class="pbox" style="width:auto">
      <img id="p1Avatar" src="" alt="" class="pavatar">
      <div class="min-w-0">
        <div class="pname" id="p1Name">Player</div>
        <div id="p1HpContainer" style="white-space: nowrap"></div>
        <div class="pexp" id="p1Exp">0 EXP</div>
      </div>
    </div>
    <div class="vs" id="rankBadge">#1</div>
  </header>
  <div id="strip" class="strip"></div>

  <!-- KANJI -->
  <main class="arena" id="arenaMain">
    <button id="btnStats" class="btn-stats" aria-label="Statistik"><i class="fa-solid fa-ranking-star"></i></button>
    <div class="pill" id="pillText">Pilih Cara Baca</div>
    <div id="kanjiDisplay" class="kanji jp">&nbsp;</div>
    <div id="qCount" class="qcount"></div>
    <button id="btnEnd" class="hidden relative mt-3 px-4 py-2 rounded-xl bg-slate-800 text-amber-300 text-xs font-black uppercase tracking-wider">Akhiri Game Sekarang</button>
  </main>

  <div class="timer-wrap"><div id="timerBar" class="timer-bar"></div></div>

  <!-- OPTIONS -->
  <footer class="options">
    <div class="grid2" id="optionsGrid"></div>
  </footer>

  <!-- START OVERLAY: hanya host yang bisa menekan FIGHT -->
  <div id="startOverlay" class="overlay">
    <div class="ov-inner">
      <h1 class="title-red">ARENA READY</h1>
      <button id="btnFight" class="btn-big btn-white hidden" style="box-shadow: 0 0 40px rgba(255,255,255,.3)">FIGHT!</button>
      <div id="waitHost" class="text-slate-300 font-bold text-lg hidden"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Menunggu host memulai...</div>
    </div>
  </div>

  <!-- GAME OVER -->
  <div id="gameOverOverlay" class="overlay hidden">
    <div class="ov-inner">
      <h1 class="font-black uppercase tracking-widest mb-2" style="font-size: clamp(32px, 10vw, 48px)" id="winnerText">YOU WIN!</h1>
      <p class="text-lg font-bold text-slate-400 mb-1" id="expResult">Total EXP: 0</p>
      <p class="text-sm font-bold text-amber-300 mb-6" id="winReason"></p>
      <div id="finalBoard" class="text-left mb-3" style="max-height:34vh;overflow-y:auto"></div>
      <button id="btnStatsOver" class="btn-big btn-dark mb-3" style="font-size: 16px"><i class="fa-solid fa-ranking-star mr-2"></i>RIWAYAT & STATISTIK</button>
      <button onclick="window.location.href='/'" class="btn-big btn-white mb-3">PLAY AGAIN</button>
      <button id="btnLobby" class="btn-big btn-dark" style="font-size: 16px">BACK TO LOBBY</button>
    </div>
  </div>

  <!-- TOAST -->
  <div id="toast" class="toast hidden">
    <div class="t-title" id="toastTitle"></div>
    <div><span class="t-kanji jp" id="toastKanji"></span><span class="t-read jp" id="toastReading"></span></div>
    <div class="t-mean" id="toastMean"></div>
    <div class="t-pick jp" id="toastPicked"></div>
  </div>

  <!-- STATISTIK -->
  <div id="statsModal" class="modal hidden">
    <div class="sheet">
      <div class="sheet-head"><span><i class="fa-solid fa-ranking-star text-yellow-400 mr-2"></i>STATISTIK</span>
        <button id="btnCloseStats" class="text-2xl text-slate-400 px-2" aria-label="Tutup">&times;</button></div>
      <div id="lbList"></div>
      <div class="tabs"><button class="tab active" data-who="me">Riwayat Saya</button></div>
      <div id="histList" class="hist-scroll"></div>
    </div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-auth.js";
  import { getDatabase, ref, onValue, update, increment, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyDAijNVFhFmTEMDqY-EKAtIXF6vXD1Hafg",
    authDomain: "kanji-battle-6a0cb.firebaseapp.com",
    databaseURL: "https://kanji-battle-6a0cb-default-rtdb.asia-southeast1.firebasedatabase.app",
    projectId: "kanji-battle-6a0cb",
    storageBucket: "kanji-battle-6a0cb.firebasestorage.app",
    messagingSenderId: "859882453524",
    appId: "1:859882453524:web:35065123791df56224c501",
    measurementId: "G-5XP3KCCNXM"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getDatabase(app);

  const $ = (id) => document.getElementById(id);
  const roomId = new URLSearchParams(window.location.search).get("id");
  if (!roomId) window.location.href = "/";

  let currentUser = null, isHost = false, questions = [], shownIndex = -1;
  let timerInterval, timeLeft = 15, isProcessing = false, gameOverShown = false, doneSent = false, finishing = false, lastData = null;

  // ===== Helpers =====
  const esc = (v) => String(v ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
  const optsOf = (q) => (Array.isArray(q.options) ? q.options : Object.values(q.options || {}));
  const correctText = (q) => (optsOf(q).find((o) => o.isCorrect) || {}).text || "";
  const WRONG_DELAY = 1300, OK_DELAY = 700, MEDAL = ["🥇", "🥈", "🥉"];
  const plist = (d) => Object.entries(d.players || {}).map(([uid, p]) => ({ uid, ...p }));
  // Ranking: EXP tertinggi -> HP terbanyak -> selesai paling cepat
  const ranked = (d) => plist(d).sort((a, b) => (b.exp || 0) - (a.exp || 0) || (b.hp || 0) - (a.hp || 0) || (a.finishedAt || 9e15) - (b.finishedAt || 9e15));
  const hist = (p) => Object.entries((p && p.history) || {}).map(([i, v]) => ({ i: Number(i), ...v })).sort((a, b) => a.i - b.i);

  // ===== Toast =====
  let toastTimer;
  function showToast(q, type, picked) {
    const t = $("toast");
    t.className = `toast ${type}`;
    $("toastTitle").textContent = type === "ok" ? "✓ Benar!" : type === "time" ? "⏱ Waktu habis — jawaban benar:" : "✗ Salah — jawaban benar:";
    $("toastKanji").textContent = q.kanji;
    $("toastReading").textContent = correctText(q);
    $("toastMean").textContent = q.arti;
    $("toastPicked").textContent = type === "bad" && picked ? `Jawabanmu: ${picked}` : "";
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => t.classList.add("hidden"), type === "ok" ? 2200 : 3500);
  }
  $("toast").onclick = () => $("toast").classList.add("hidden");

  // ===== Leaderboard & statistik =====
  function boardHTML(list) {
    return list.map((p, i) => {
      const h = hist(p), ok = h.filter((x) => x.ok).length, bad = h.length - ok;
      return `<div class="lb-row ${p.uid === currentUser.uid ? "me" : ""}">
        <div class="lb-rank">${MEDAL[i] || i + 1}</div>
        <img class="lb-av" src="${esc(p.photo || "")}" alt="">
        <div class="min-w-0 flex-1">
          <div class="font-bold text-sm truncate">${esc(p.name || "Player")}${p.uid === currentUser.uid ? " (Kamu)" : ""}</div>
          <div class="lb-stat"><span class="text-emerald-400">✓ ${ok}</span><span class="text-red-400">✗ ${bad}</span><span class="text-red-300">❤ ${Math.max(0, p.hp || 0)}</span></div>
        </div>
        <div class="font-black text-emerald-400">${p.exp || 0}<span class="text-[10px]"> EXP</span></div>
      </div>`;
    }).join("");
  }
  function renderStats() {
    if (!lastData) return;
    const list = ranked(lastData);
    $("lbList").innerHTML = boardHTML(list);
    const mine = hist(lastData.players[currentUser.uid]).reverse();
    $("histList").innerHTML = mine.length ? mine.map((h) => `
      <div class="h-item ${h.ok ? "" : "bad"}">
        <div><span class="text-xs text-slate-500 font-bold">#${h.i + 1}</span> <span class="h-kanji jp">${esc(h.kanji)}</span><span class="h-read jp">${esc(h.furigana)}</span></div>
        <div class="h-mean">${esc(h.arti)}</div>
        ${h.ok ? "" : `<div class="h-pick jp">${h.timeout ? "⏱ Waktu habis" : "Jawabanmu: " + esc(h.picked)}</div>`}
      </div>`).join("") : `<div class="text-center text-slate-500 text-sm py-8">Belum ada riwayat jawaban.</div>`;
  }
  const openStats = () => { renderStats(); $("statsModal").classList.remove("hidden"); };
  $("btnStats").onclick = openStats;
  $("btnStatsOver").onclick = openStats;
  $("btnCloseStats").onclick = () => $("statsModal").classList.add("hidden");
  $("statsModal").onclick = (e) => { if (e.target.id === "statsModal") $("statsModal").classList.add("hidden"); };

  function renderStrip(list) {
    $("strip").innerHTML = list.map((p, i) => `
      <div class="chip2 ${p.uid === currentUser.uid ? "me" : ""} ${(p.hp || 0) <= 0 ? "dead" : ""}">
        <img src="${esc(p.photo || "")}" alt=""><span>${MEDAL[i] || i + 1}</span><span class="text-emerald-400">${p.exp || 0}</span>${p.done ? "<span>✓</span>" : ""}
      </div>`).join("");
  }
  function renderMe(p, rank, total) {
    $("p1Name").textContent = p.name || "Player";
    if ($("p1Avatar").getAttribute("src") !== (p.photo || "")) $("p1Avatar").src = p.photo || "";
    $("p1Exp").textContent = `${p.exp || 0} EXP`;
    let hearts = "";
    for (let i = 0; i < 5; i++) hearts += `<i class="fa-solid fa-heart hp-heart ${i >= (p.hp || 0) ? "lost" : ""}"></i>`;
    $("p1HpContainer").innerHTML = hearts;
    $("rankBadge").textContent = `#${rank}/${total}`;
  }

  // ===== Audio =====
  const bgm = $("bgm");
  bgm.volume = 0.35;
  let bgmWanted = false;
  function startBgm() { bgmWanted = true; bgm.play().catch(() => {}); }
  function stopBgm() { bgmWanted = false; bgm.pause(); try { bgm.currentTime = 0; } catch (e) {} }
  window.addEventListener("pointerdown", () => { if (bgmWanted && bgm.paused) bgm.play().catch(() => {}); });
  const sfxCorrect = $("sfx-correct"), sfxWrong = $("sfx-wrong");
  const play = (el) => { try { el.currentTime = 0; el.play().catch(() => {}); } catch (e) {} };
  function unlockAudio() {
    [sfxCorrect, sfxWrong].forEach((a) => {
      a.muted = true;
      a.play().then(() => { a.pause(); a.currentTime = 0; a.muted = false; }).catch(() => { a.muted = false; });
    });
    window.removeEventListener("pointerdown", unlockAudio);
  }
  window.addEventListener("pointerdown", unlockAudio, { once: true });

  $("btnLobby").onclick = () => { window.location.href = `/room?id=${roomId}`; };

  // Hanya host yang memulai
  $("btnFight").onclick = async () => {
    if (!isHost) return;
    $("btnFight").disabled = true;
    startBgm();
    try { await update(ref(db, `rooms/${roomId}`), { fightStarted: true, fightAt: Date.now() }); }
    catch (e) { console.error(e); $("btnFight").disabled = false; }
  };

  // Host bisa mengakhiri paksa (mis. ada pemain yang keluar/disconnect)
  $("btnEnd").onclick = () => finishGame(lastData);
  function finishGame(d) {
    if (!d || !isHost) return;
    const list = ranked(d);
    update(ref(db, `rooms/${roomId}`), { status: "finished", winner: list[0].uid, winReason: "rank" });
  }

  onAuthStateChanged(auth, (user) => {
    if (!user) return (window.location.href = "/");
    currentUser = user;

    onValue(ref(db, `rooms/${roomId}`), (snapshot) => {
      const data = snapshot.val();
      if (!data || !data.players) return;
      const me = data.players[currentUser.uid];
      if (!me) { window.location.href = "/"; return; }

      isHost = data.host.uid === currentUser.uid;
      questions = data.questions ? Object.values(data.questions) : [];
      lastData = data;

      const list = ranked(data);
      renderMe(me, list.findIndex((p) => p.uid === currentUser.uid) + 1, list.length);
      renderStrip(list);
      if (!$("statsModal").classList.contains("hidden")) renderStats();

      if (data.status === "finished") return showGameOver(list, me);

      if (!data.fightStarted) {
        $("startOverlay").classList.remove("hidden");
        $("btnFight").classList.toggle("hidden", !isHost);
        $("waitHost").classList.toggle("hidden", isHost);
        return;
      }
      $("startOverlay").classList.add("hidden");
      if (!bgmWanted && !gameOverShown) startBgm();

      // Host menutup game saat semua pemain selesai / HP habis
      if (isHost && !finishing && list.length && list.every((p) => p.done)) {
        finishing = true;
        return finishGame(data);
      }

      const myIndex = me.qIndex || 0;
      if (me.done || (me.hp || 0) <= 0 || myIndex >= questions.length) {
        clearInterval(timerInterval);
        $("kanjiDisplay").textContent = (me.hp || 0) <= 0 ? "💀" : "✓";
        $("optionsGrid").innerHTML = "";
        $("pillText").textContent = "Selesai";
        const doneCount = list.filter((p) => p.done).length;
        $("qCount").textContent = `Menunggu pemain lain (${doneCount}/${list.length})`;
        $("btnEnd").classList.toggle("hidden", !isHost);
        if (!doneSent && !me.done) {
          doneSent = true;
          update(ref(db, `rooms/${roomId}/players/${currentUser.uid}`), { done: true, finishedAt: serverTimestamp() });
        }
        return;
      }
      if (myIndex !== shownIndex) { shownIndex = myIndex; loadQuestion(myIndex); }
    });
  });

  function renderQuestion(q, onPick) {
    const kanjiEl = $("kanjiDisplay");
    kanjiEl.textContent = q.kanji;
    const len = [...String(q.kanji)].length;
    kanjiEl.style.fontSize = len <= 2 ? "" : len <= 4 ? "clamp(44px, 15vw, 76px)" : len <= 6 ? "clamp(34px, 11vw, 56px)" : "clamp(26px, 8vw, 40px)";
    const grid = $("optionsGrid");
    grid.innerHTML = "";
    optsOf(q).forEach((opt, i) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "btn-option jp";
      b.textContent = opt.text;
      b.onclick = () => onPick(i, !!opt.isCorrect);
      grid.appendChild(b);
    });
  }

  function loadQuestion(index) {
    isProcessing = false;
    renderQuestion(questions[index], selectAnswer);
    $("pillText").textContent = "Pilih Cara Baca";
    $("qCount").textContent = `Soal ${index + 1} / ${questions.length}`;
    resetTimer();
  }

  function resetTimer(cb = handleTimeOut, secs = 15) {
    clearInterval(timerInterval);
    timeLeft = secs;
    const bar = $("timerBar");
    bar.style.transition = "none";
    bar.style.width = "100%";
    void bar.offsetWidth;
    bar.style.transition = "width 1s linear";
    timerInterval = setInterval(() => {
      timeLeft--;
      bar.style.width = `${(timeLeft / secs) * 100}%`;
      if (timeLeft <= 0) { clearInterval(timerInterval); cb(); }
    }, 1000);
  }

  function shake() {
    const m = $("arenaMain");
    m.classList.add("shake-anim");
    setTimeout(() => m.classList.remove("shake-anim"), 300);
  }

  function handleTimeOut() {
    if (isProcessing) return;
    isProcessing = true;
    const idx = shownIndex, q = questions[idx];
    play(sfxWrong); shake();
    const buttons = document.querySelectorAll(".btn-option");
    buttons.forEach((b) => (b.disabled = true));
    const ci = optsOf(q).findIndex((o) => o.isCorrect);
    if (buttons[ci]) buttons[ci].classList.add("btn-correct");
    showToast(q, "time");
    const base = `rooms/${roomId}/players/${currentUser.uid}`;
    const updates = {
      [`${base}/hp`]: increment(-1),
      [`${base}/qIndex`]: increment(1),
      [`${base}/history/${idx}`]: { kanji: q.kanji, furigana: correctText(q), arti: q.arti, picked: null, ok: false, timeout: true },
    };
    setTimeout(() => update(ref(db), updates), WRONG_DELAY);
  }

  function selectAnswer(index, isCorrect) {
    if (isProcessing) return;
    isProcessing = true;
    clearInterval(timerInterval);
    const idx = shownIndex, q = questions[idx], o = optsOf(q);
    const buttons = document.querySelectorAll(".btn-option");
    buttons.forEach((b) => (b.disabled = true));
    const base = `rooms/${roomId}/players/${currentUser.uid}`;
    const updates = {};
    updates[`${base}/qIndex`] = increment(1);
    updates[`${base}/history/${idx}`] = { kanji: q.kanji, furigana: correctText(q), arti: q.arti, picked: o[index].text, ok: isCorrect, timeout: false };
    if (isCorrect) {
      play(sfxCorrect);
      buttons[index].classList.add("btn-correct");
      updates[`${base}/exp`] = increment(20 + Math.max(0, timeLeft)); // bonus kecepatan ala Quizizz
    } else {
      play(sfxWrong);
      buttons[index].classList.add("btn-wrong");
      updates[`${base}/hp`] = increment(-1);
      updates[`${base}/exp`] = increment(-5);
      shake();
      const ci = o.findIndex((x) => x.isCorrect);
      if (buttons[ci]) buttons[ci].classList.add("btn-correct");
    }
    showToast(q, isCorrect ? "ok" : "bad", o[index].text);
    setTimeout(() => update(ref(db), updates), isCorrect ? OK_DELAY : WRONG_DELAY);
  }

  function showGameOver(list, me) {
    if (gameOverShown) return;
    gameOverShown = true;
    stopBgm();
    clearInterval(timerInterval);
    $("startOverlay").classList.add("hidden");
    $("gameOverOverlay").classList.remove("hidden");
    clearTimeout(toastTimer);
    $("toast").classList.add("hidden");
    const rank = list.findIndex((p) => p.uid === currentUser.uid) + 1;
    $("expResult").textContent = `Total EXP: ${me.exp || 0}`;
    $("winReason").textContent = `Peringkat ${rank} dari ${list.length} pemain`;
    $("finalBoard").innerHTML = boardHTML(list);
    const title = $("winnerText");
    if (rank === 1) { title.textContent = "JUARA 1! 🏆"; title.classList.add("text-yellow-400"); }
    else { title.textContent = `PERINGKAT ${MEDAL[rank - 1] || "#" + rank}`; title.classList.add("text-slate-200"); }
  }
</script>
</body>
</html>
