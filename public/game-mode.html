<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0F172A">
  <title>Arena | Kanji Battle</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;700;900&family=Noto+Sans+JP:wght@700;800;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  <style>
    html, body { height: 100%; }
    body { font-family: 'Inter', sans-serif; background: #0F172A; color: #fff; overflow: hidden; touch-action: manipulation; -webkit-tap-highlight-color: transparent; -webkit-user-select: none; user-select: none; }
    .jp { font-family: 'Noto Sans JP', sans-serif; }

    .app { height: 100vh; height: 100dvh; max-width: 480px; margin: 0 auto; display: flex; flex-direction: column; background: #0F172A; position: relative;
      padding-top: env(safe-area-inset-top); padding-left: env(safe-area-inset-left); padding-right: env(safe-area-inset-right); }

    /* HEADER */
    .topbar { padding: 10px 12px; display: flex; align-items: center; justify-content: space-between; gap: 8px; background: rgba(15,23,42,.95); border-bottom: 1px solid #1E293B; flex-shrink: 0; }
    .pbox { display: flex; align-items: center; gap: 8px; width: 42%; min-width: 0; }
    .pbox.right { flex-direction: row-reverse; text-align: right; }
    .pavatar { width: clamp(34px, 10vw, 44px); height: clamp(34px, 10vw, 44px); border-radius: 9999px; border: 2px solid #475569; object-fit: cover; flex-shrink: 0; }
    .pname { font-size: 10px; font-weight: 700; color: #94A3B8; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .hp-heart { font-size: clamp(11px, 3.2vw, 14px); color: #EF4444; margin: 0 1px; }
    .hp-heart.lost { color: #1E293B; }
    .pexp { font-size: 10px; font-weight: 700; color: #4ADE80; margin-top: 1px; }
    .vs { font-size: clamp(16px, 5vw, 22px); font-weight: 900; font-style: italic; color: #FBBF24; flex-shrink: 0; }

    /* ARENA */
    .arena { flex: 1 1 0; min-height: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 12px 16px; position: relative; }
    .arena::before { content: ""; position: absolute; inset: 0; background: linear-gradient(to bottom, rgba(30,64,175,.1), rgba(127,29,29,.1)); pointer-events: none; }
    .pill { font-size: 11px; font-weight: 900; letter-spacing: .12em; color: #94A3B8; background: rgba(30,41,59,.85); border: 1px solid #334155; padding: 5px 14px; border-radius: 9999px; text-transform: uppercase; margin-bottom: clamp(10px, 3vh, 24px); position: relative; }
    .kanji { font-size: clamp(52px, 19vw, 96px); font-weight: 900; line-height: 1.1; text-align: center; width: 100%; overflow-wrap: anywhere; word-break: break-all; text-shadow: 0 0 30px rgba(255,255,255,.2); position: relative; }
    .qcount { position: relative; margin-top: clamp(8px, 2vh, 16px); font-size: 12px; font-weight: 700; color: #64748B; }

    @keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-8px); } 75% { transform: translateX(8px); } }
    .shake-anim { animation: shake .3s ease-in-out; }

    /* TIMER */
    .timer-wrap { height: 8px; background: #1E293B; flex-shrink: 0; }
    .timer-bar { height: 100%; width: 100%; background: linear-gradient(to right, #FACC15, #EF4444); transition: width 1s linear; }

    /* OPTIONS */
    .options { padding: 12px 12px calc(14px + env(safe-area-inset-bottom)); background: #0F172A; flex-shrink: 0; }
    .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: clamp(8px, 2.5vw, 12px); }
    .btn-option { background: #1E293B; border: 2px solid #334155; border-radius: 18px; color: #fff; font-weight: 700;
      min-height: clamp(56px, 11vh, 84px); padding: 8px 10px; font-size: clamp(16px, 4.8vw, 22px); line-height: 1.2; overflow-wrap: anywhere; display: flex; align-items: center; justify-content: center; text-align: center; transition: transform .12s, background .12s; }
    .btn-option:active:not(:disabled) { transform: scale(.96); background: #334155; }
    .btn-correct { background: #10B981 !important; border-color: #059669 !important; box-shadow: 0 0 22px rgba(16,185,129,.5); }
    .btn-wrong { background: #EF4444 !important; border-color: #B91C1C !important; box-shadow: 0 0 22px rgba(239,68,68,.5); }

    /* OVERLAYS */
    .overlay { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.92); display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 24px; text-align: center;
      padding-bottom: calc(24px + env(safe-area-inset-bottom)); padding-top: calc(24px + env(safe-area-inset-top)); }
    .overlay.hidden { display: none; }
    .ov-inner { width: 100%; max-width: 420px; }
    .title-red { font-size: clamp(34px, 11vw, 52px); font-weight: 900; text-transform: uppercase; letter-spacing: .1em; background: linear-gradient(to bottom, #F87171, #B91C1C); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; margin-bottom: 20px; }
    .btn-big { width: 100%; min-height: 56px; border-radius: 18px; font-weight: 900; font-size: 18px; }
    .btn-white { background: #fff; color: #0F172A; }
    .btn-dark { background: #1E293B; color: #94A3B8; }
    .btn-white:active, .btn-dark:active { transform: scale(.97); }

    /* TOAST JAWABAN */
    .toast { position: fixed; z-index: 70; left: 50%; top: calc(76px + env(safe-area-inset-top)); transform: translateX(-50%); width: min(92vw, 380px); padding: 10px 14px; border-radius: 16px; background: rgba(15,23,42,.96); border: 2px solid #334155; box-shadow: 0 10px 30px rgba(0,0,0,.5); animation: toastIn .22s ease-out; text-align: left; }
    .toast.hidden { display: none; }
    .toast.ok { border-color: #10B981; } .toast.bad { border-color: #EF4444; } .toast.time { border-color: #F59E0B; }
    .toast .t-title { font-size: 11px; font-weight: 900; letter-spacing: .1em; text-transform: uppercase; }
    .toast.ok .t-title { color: #34D399; } .toast.bad .t-title { color: #F87171; } .toast.time .t-title { color: #FBBF24; }
    .toast .t-kanji { font-size: 26px; font-weight: 900; line-height: 1.15; }
    .toast .t-read { font-size: 15px; font-weight: 700; color: #FDE68A; margin-left: 8px; }
    .toast .t-mean { font-size: 13px; color: #CBD5E1; margin-top: 2px; }
    .toast .t-pick { font-size: 11px; color: #94A3B8; margin-top: 3px; }
    @keyframes toastIn { from { opacity: 0; transform: translate(-50%, -10px); } to { opacity: 1; transform: translate(-50%, 0); } }

    /* TOMBOL STATISTIK */
    .btn-stats { position: absolute; top: 10px; right: 12px; z-index: 5; width: 40px; height: 40px; border-radius: 9999px; background: rgba(30,41,59,.9); border: 1px solid #334155; color: #FBBF24; font-size: 16px; }

    /* MODAL STATISTIK */
    .modal { position: fixed; inset: 0; z-index: 80; background: rgba(0,0,0,.75); display: flex; align-items: flex-end; justify-content: center; }
    .modal.hidden { display: none; }
    .sheet { width: 100%; max-width: 480px; max-height: 88dvh; background: #0F172A; border: 1px solid #334155; border-radius: 24px 24px 0 0; display: flex; flex-direction: column; padding: 14px 14px calc(14px + env(safe-area-inset-bottom)); }
    .sheet-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; font-weight: 900; letter-spacing: .1em; }
    .lb-row { display: flex; align-items: center; gap: 10px; background: #1E293B; border-radius: 14px; padding: 8px 10px; margin-bottom: 6px; }
    .lb-row.me { border: 1px solid #FBBF24; }
    .lb-rank { width: 22px; font-weight: 900; text-align: center; }
    .lb-av { width: 34px; height: 34px; border-radius: 9999px; object-fit: cover; }
    .lb-stat { font-size: 11px; font-weight: 700; display: flex; gap: 8px; margin-top: 2px; }
    .tabs { display: flex; gap: 6px; margin: 8px 0; }
    .tab { flex: 1; padding: 8px; border-radius: 12px; background: #1E293B; color: #94A3B8; font-weight: 800; font-size: 12px; }
    .tab.active { background: #fff; color: #0F172A; }
    .fx.block .fx-flash { box-shadow: inset 0 0 100px 12px rgba(56,189,248,.7); }
    .fx.scramble .fx-flash { box-shadow: inset 0 0 100px 12px rgba(168,85,247,.7); }
    .fx.freeze .fx-flash { box-shadow: inset 0 0 100px 12px rgba(125,211,252,.8); }
    /* ITEM, PENGUMUMAN, REAKSI, BEKU */
    .itembar { position: relative; display: flex; gap: 6px; margin-top: 8px; }
    .it { display: flex; align-items: center; gap: 4px; background: #1E293B; border: 1px solid #475569; border-radius: 12px; padding: 4px 9px; font-size: 10px; font-weight: 800; color: #fff; }
    .it:active { transform: scale(.94); } .it.off { opacity: .3; } .it b { color: #FBBF24; font-size: 12px; } .it-i { font-size: 16px; }
    .reactbar { position: absolute; left: 10px; top: 10px; z-index: 5; display: flex; gap: 4px; }
    .rbtn { width: 34px; height: 34px; border-radius: 9999px; background: rgba(30,41,59,.9); border: 1px solid #334155; font-size: 16px; }
    .rbtn:active { transform: scale(.88); }
    .react-float { position: fixed; z-index: 66; bottom: 150px; display: flex; flex-direction: column; align-items: center; pointer-events: none; animation: rUp 2.2s ease-out forwards; }
    .react-float span { font-size: 38px; } .react-float small { font-size: 9px; font-weight: 800; color: #CBD5E1; background: rgba(0,0,0,.5); border-radius: 9999px; padding: 1px 6px; }
    @keyframes rUp { 0% { opacity: 0; transform: translateY(0) scale(.5); } 15% { opacity: 1; transform: translateY(-30px) scale(1.1); } 100% { opacity: 0; transform: translateY(-260px) scale(1); } }
    .announce { position: fixed; z-index: 68; left: 50%; top: calc(196px + env(safe-area-inset-top)); transform: translateX(-50%); max-width: 92vw; padding: 7px 14px; border-radius: 9999px; background: rgba(15,23,42,.94);
      border: 1px solid #475569; font-size: 12px; font-weight: 900; text-align: center; pointer-events: none; animation: annIn 1.9s ease-out forwards; }
    .announce.hidden { display: none; } .announce.gold { border-color: #FBBF24; color: #FDE68A; } .announce.red { border-color: #EF4444; color: #FCA5A5; }
    @keyframes annIn { 0% { opacity: 0; transform: translate(-50%,-10px); } 10% { opacity: 1; transform: translate(-50%,0); } 85% { opacity: 1; } 100% { opacity: 0; } }
    .options { position: relative; }
    .options.frozen .btn-option { filter: grayscale(.6) brightness(.8); pointer-events: none; border-color: #7DD3FC; }
    .options.frozen::before { content: "❄️ BEKU!"; position: absolute; left: 50%; top: -10px; transform: translateX(-50%); background: #0EA5E9; color: #fff; font-size: 11px; font-weight: 900; padding: 2px 10px; border-radius: 9999px; z-index: 3; }
    #optionsGrid.scr { animation: shake .4s ease-in-out; }

    .h-item.bad { border-left-color: #EF4444; }
    .h-kanji { font-size: 20px; font-weight: 900; }
    .h-read { font-size: 13px; font-weight: 700; color: #FDE68A; margin-left: 6px; }
    .h-mean { font-size: 12px; color: #CBD5E1; }
    .h-pick { font-size: 11px; color: #F87171; margin-top: 2px; }

    .combo.soft { background: #1E293B; color: #FBBF24; box-shadow: none; border: 1px solid #334155; animation: none; }
    .combo.hot { background: linear-gradient(135deg,#7C3AED,#EF4444); box-shadow: 0 0 22px rgba(239,68,68,.6); }
    @keyframes comboPulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.06); } }
    /* EFEK SERANGAN (partikel, tidak menutup soal) */
    .fx { position: fixed; inset: 0; z-index: 65; pointer-events: none; overflow: hidden; }
    .fx.hidden { display: none; }
    .fx-flash { position: absolute; inset: 0; animation: fxFlash .8s ease-out forwards; }
    .fx.bolt .fx-flash { box-shadow: inset 0 0 90px 10px rgba(250,204,21,.65); }
    .fx.bomb .fx-flash { box-shadow: inset 0 0 100px 14px rgba(249,115,22,.75); }
    .fx.in.bolt .fx-flash, .fx.in.bomb .fx-flash { box-shadow: inset 0 0 110px 16px rgba(239,68,68,.8); }

    .fx-p { position: absolute; border-radius: 2px; opacity: 0; animation: pBurst var(--t,.9s) ease-out forwards; }
    .fx-text { position: absolute; left: 50%; top: calc(112px + env(safe-area-inset-top)); transform: translateX(-50%); white-space: nowrap; padding: 4px 12px; border-radius: 9999px;
      background: rgba(0,0,0,.65); font-weight: 900; font-size: 12px; letter-spacing: .06em; animation: fxFlash 1.4s ease-out forwards; }
    @keyframes fxFlash { 0% { opacity: 0; } 12% { opacity: 1; } 100% { opacity: 0; } }
    @keyframes pBurst { 0% { opacity: 1; transform: translate(0,0) rotate(0) scale(1); } 100% { opacity: 0; transform: translate(var(--dx),var(--dy)) rotate(var(--r)) scale(.3); } }

    .fx.bolt .fx-flash { background: radial-gradient(circle, rgba(253,224,71,.85), rgba(147,197,253,.3) 60%, transparent); }

<body>
<div class="app">

  <audio id="bgm" src="/backsound" loop preload="auto"></audio>
  <audio id="sfx-correct" src="https://cdn.pixabay.com/download/audio/2021/08/04/audio_0625c1539c.mp3" preload="auto"></audio>
  <audio id="sfx-wrong" src="https://cdn.pixabay.com/download/audio/2022/03/10/audio_c8c8a73467.mp3" preload="auto"></audio>

  <!-- TOP BAR -->
  <header class="topbar">
    <div class="pbox" style="width:auto">
      <img id="p1Avatar" src="" alt="" class="pavatar">
      <div class="min-w-0">
        <div class="pname" id="p1Name">Player</div>
        <div id="p1HpContainer" style="white-space: nowrap"></div>
        <div class="pexp" id="p1Exp">0 EXP</div>
      </div>
    </div>
    <div class="vs" id="rankBadge">#1</div>
  </header>
  <div id="strip" class="strip"></div>

  <!-- KANJI -->
  <main class="arena" id="arenaMain">
    <button id="btnStats" class="btn-stats" aria-label="Statistik"><i class="fa-solid fa-ranking-star"></i></button>
    <div class="pill" id="pillText">Pilih Cara Baca</div>
    <div id="kanjiDisplay" class="kanji jp">&nbsp;</div>
    <div id="comboBadge" class="combo hidden"></div>
    <div id="qCount" class="qcount"></div>
    <button id="btnEnd" class="hidden relative mt-3 px-4 py-2 rounded-xl bg-slate-800 text-amber-300 text-xs font-black uppercase tracking-wider">Akhiri Game Sekarang</button>
  </main>

  <div class="actionrow">
    <div id="itemBar" class="itembar"></div>
    <div id="reactBar" class="reactbar">
      <button type="button" class="rbtn" data-e="😂">😂</button><button type="button" class="rbtn" data-e="🔥">🔥</button><button type="button" class="rbtn" data-e="😭">😭</button><button type="button" class="rbtn" data-e="👏">👏</button>
    </div>
  </div>

  <div class="timer-wrap"><div id="timerBar" class="timer-bar"></div></div>

  <!-- OPTIONS -->
  <footer class="options">
    <div class="grid2" id="optionsGrid"></div>
  </footer>

  <!-- START OVERLAY: hanya host yang bisa menekan FIGHT -->
  <div id="startOverlay" class="overlay">
    <div class="ov-inner">
      <h1 class="title-red">ARENA READY</h1>
      <button id="btnFight" class="btn-big btn-white hidden" style="box-shadow: 0 0 40px rgba(255,255,255,.3)">FIGHT!</button>
      <div id="waitHost" class="text-slate-300 font-bold text-lg hidden"><i class="fa-solid fa-spinner fa-spin mr-2"></i>Menunggu host memulai...</div>
    </div>

  }
  window.addEventListener("pointerdown", unlockAudio, { once: true });

  // ===== Combo, serangan, salin riwayat =====
  const multOf = (s) => (s >= 5 ? 3 : s >= 3 ? 2 : 1);   // streak 3-4 = x2, streak 5+ = x3

  function renderCombo() {

      el.className = "combo soft";
    } else el.className = "combo hidden";
  }

  function pickTarget(any) {

    if (!c.length) return null;
    c.sort((a, b) => (b.exp || 0) - (a.exp || 0));   // lawan dengan EXP tertinggi jadi sasaran
    return c[0];
  }

  let actx;
  function sfxBoom(bomb) {
    try {
      actx = actx || new (window.AudioContext || window.webkitAudioContext)();
      const len = Math.floor(actx.sampleRate * (bomb ? 0.7 : 0.35)), buf = actx.createBuffer(1, len, actx.sampleRate), d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 2);
      const s = actx.createBufferSource(), f = actx.createBiquadFilter(), g = actx.createGain();
      s.buffer = buf; f.type = bomb ? "lowpass" : "highpass"; f.frequency.value = bomb ? 400 : 1500; g.gain.value = 0.6;
      s.connect(f); f.connect(g); g.connect(actx.destination); s.start();
    } catch (e) {}
  }

  const FX = {
    bolt: { i: "⚡", l: "PETIR", c: ["#FACC15", "#FDE047", "#93C5FD", "#FFFFFF"] },
    bomb: { i: "💣", l: "BOM", c: ["#F97316", "#EF4444", "#FACC15", "#FDE68A"] },

  };
  function showFx(type, dir, name, dmg) {

    fx.classList.add("hidden"); void fx.offsetWidth;
    fx.className = `fx ${FX[type] ? type : "bolt"} ${dir}`;
    announce(type === "block"
      ? (dir === "in" ? `🛡️ Perisaimu menahan serangan ${name}!` : `🛡️ Seranganmu diblok perisai ${name}`)
      : `${f.i} ${f.l} ${dir === "in" ? "dari" : "ke"} ${name}${dmg ? ` −${dmg}` : ""}`, dir === "in" ? "red" : "gold");
    const box = $("fxIcon"); box.innerHTML = "";

        `--dx:${(Math.random() - .5) * (bomb ? 220 : 90)}px;--dy:${bomb ? (Math.random() - .5) * 220 : 80 + Math.random() * 180}px;--r:${Math.random() * 360}deg;--t:${.6 + Math.random() * .6}s`;
      box.appendChild(p);

    if (dir === "in" && (type === "bolt" || type === "bomb")) shake();
    if (type === "bolt" || type === "bomb") sfxBoom(bomb);

  }

  // ===== Pengumuman =====

  function announce(text, cls = "") {

    setTimeout(() => d.remove(), 2800);
  }
  function detectEvents(data, list) {
    if (!data.fightStarted) { prevState = null; return; }

    if (prevState) {
      const pl = Object.keys(prevState).find((u) => prevState[u].rank === 1), nl = list[0].uid, old = list.find((p) => p.uid === pl);
      if (pl && nl !== pl && old && (list[0].exp || 0) > (old.exp || 0)) announce(`👑 ${cur[nl].name} menyalip ${prevState[pl].name} ke peringkat 1!`, "gold");
      list.forEach((p) => {

  // ===== Ronde final & boss =====

  const qInfo = (idx) => ({ final: finalN(questions.length) > 0 && idx >= questions.length - finalN(questions.length), boss: !(questions[idx] && questions[idx].retry) && (idx + 1) % 10 === 0 });

  // ===== Soal salah muncul lagi (3 soal kemudian, sekali saja) =====
  function effList(data, me) {

  }

  function tapReact() { floatReact(holdEmoji, "", 2); pendN++; flushReact(false); }
  document.querySelectorAll(".rbtn").forEach((b) => {
    b.addEventListener("pointerdown", (ev) => { ev.preventDefault(); holdEmoji = b.dataset.e; tapReact(); clearInterval(holdTimer); holdTimer = setInterval(tapReact, 160); });
    ["pointerup", "pointerleave", "pointercancel"].forEach((t) => b.addEventListener(t, () => { clearInterval(holdTimer); flushReact(true); }));
    b.addEventListener("contextmenu", (ev) => ev.preventDefault());
  });
  function handleReact(data) {
    const r = data.react;
    if (lastReactAt === null) { lastReactAt = r ? r.at : 0; return; }
    if (r && r.at !== lastReactAt) {
      lastReactAt = r.at;
      if (r.uid !== currentUser.uid && REACTS.includes(r.emoji)) floatReact(r.emoji, r.from, Math.min(Number(r.n) || 1, 12));
    }
  }

  // ===== Rematch satu tap (host) =====
  function resetLocal() {
    gameOverShown = false; doneSent = false; finishing = false; shownIndex = -1; streakInit = false; streak = 0; frozenUntil = 0; prevState = null; $("toasts").innerHTML = "";
    $("gameOverOverlay").classList.add("hidden");
    $("winnerText").classList.remove("text-yellow-400", "text-slate-200");
    $("btnRematch").disabled = false; $("btnRematch").textContent = "🔁 MAIN LAGI (REMATCH)";
    renderCombo();
  }
  async function rematch() {
    if (!isHost || !lastData) return;
    const d = lastData, s = d.settings || {}, btn = $("btnRematch"), limit = s.limit || 20;
    btn.disabled = true; btn.textContent = "Menyiapkan rematch...";
    try {
      const seen = Array.isArray(d.seenKeys) ? d.seenKeys : Object.values(d.seenKeys || {});
      let res;
      if (s.mode === "custom") {
        const cards = Array.isArray(d.customCards) ? d.customCards : Object.values(d.customCards || {});
        if (!cards.length) throw new Error("Data custom tidak tersimpan. Kembali ke lobby.");
        res = await fetch("/api/battle/generate-custom", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ limit, cards, seen }) });
      } else {
        const deckIds = Array.isArray(s.deckIds) ? s.deckIds : Object.values(s.deckIds || {});
        res = await fetch("/api/battle/generate", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ limit, deckIds, seen }) });
      }
      const json = await res.json(); if (!res.ok) throw new Error(json.error);
      const meta = json.meta || { keys: [], cycleReset: false, total: 0, remaining: 0 };
      const newSeen = (meta.cycleReset ? meta.keys : [...new Set([...seen, ...meta.keys])]).slice(-5000);
      const u = {};
      plist(d).forEach((p) => { const b = `players/${p.uid}/`;
        Object.assign(u, { [b + "hp"]: 5, [b + "exp"]: 0, [b + "qIndex"]: 0, [b + "done"]: null, [b + "finishedAt"]: null, [b + "history"]: null, [b + "streak"]: null, [b + "hit"]: null, [b + "inv"]: null, [b + "shield"]: null, [b + "extra"]: null }); });
      await update(ref(db, `rooms/${roomId}`), { ...u, questions: json.data, tiebreakQuestions: json.tiebreak || null, seenKeys: newSeen,
        cycleInfo: { total: meta.total, remaining: meta.remaining, reset: !!meta.cycleReset }, tiebreak: null, winReason: null, winner: null, react: null,
        fightStarted: true, fightAt: Date.now(), status: "playing" });
    } catch (e) { alert(e.message); btn.disabled = false; btn.textContent = "🔁 MAIN LAGI (REMATCH)"; }
  }
  $("btnRematch").onclick = rematch;

  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); return true; }
    catch (e) {
      const ta = document.createElement("textarea");
      ta.value = text; ta.style.cssText = "position:fixed;opacity:0;top:0;left:0;-webkit-user-select:text;user-select:text";
      document.body.appendChild(ta); ta.focus(); ta.select();
      let ok = false; try { ok = document.execCommand("copy"); } catch (_) {}
      ta.remove(); return ok;
    }
  }
  async function copyHist(kind, btn) {
    const all = lastData ? hist(lastData.players[currentUser.uid]) : [];
    const items = kind === "wrong" ? all.filter((h) => !h.ok) : all;
    const old = btn.innerHTML;
    let text;
    if (!items.length) { btn.textContent = kind === "wrong" ? "Tidak ada yg salah" : "Belum ada riwayat"; setTimeout(() => (btn.innerHTML = old), 1500); return; }
    if (kind === "json") text = JSON.stringify(items.map((h) => ({ kanji: h.kanji, furigana: h.furigana, arti: h.arti })), null, 2);
    else text = `Kanji Battle — Riwayat (${kind === "wrong" ? "yang salah" : "semua"}) • Room ${roomId}\n` +
      items.map((h, n) => `${n + 1}. ${h.kanji} | ${h.furigana} | ${h.arti}${kind === "wrong" ? "" : h.ok ? " ✓" : " ✗"}`).join("\n");
    const ok = await copyText(text);
    btn.textContent = ok ? `✓ Tersalin (${items.length})` : "Gagal menyalin";
    setTimeout(() => (btn.innerHTML = old), 1800);
  }
  $("btnCopyText").onclick = (e) => copyHist("all", e.currentTarget);
  $("btnCopyWrong").onclick = (e) => copyHist("wrong", e.currentTarget);
  $("btnCopyJson").onclick = (e) => copyHist("json", e.currentTarget);
  $("btnCopyOver").onclick = (e) => copyHist("all", e.currentTarget);

  $("btnLobby").onclick = () => { window.location.href = `/room?id=${roomId}`; };

  // Hanya host yang memulai
  $("btnFight").onclick = async () => {
    if (!isHost) return;
    $("btnFight").disabled = true;
    startBgm();
    try { await update(ref(db, `rooms/${roomId}`), { fightStarted: true, fightAt: Date.now() }); }
    catch (e) { console.error(e); $("btnFight").disabled = false; }
  };

  // Host bisa mengakhiri paksa (mis. ada pemain yang keluar/disconnect)
  $("btnEnd").onclick = () => finishGame(lastData);
  function finishGame(d) {
    if (!d || !isHost) return;
    const list = ranked(d);
    update(ref(db, `rooms/${roomId}`), { status: "finished", winner: list[0].uid, winReason: "rank" });
  }

  onAuthStateChanged(auth, (user) => {
    if (!user) return (window.location.href = "/");
    currentUser = user;

    onValue(ref(db, `rooms/${roomId}`), (snapshot) => {
      const data = snapshot.val();
      if (!data || !data.players) return;
      const me = data.players[currentUser.uid];
      if (!me) { window.location.href = "/"; return; }

      isHost = data.host.uid === currentUser.uid;
      questions = effList(data, me);
      lastData = data;
      if (data.status !== "finished" && gameOverShown) resetLocal();
      handleReact(data);
      if (!streakInit) { streakInit = true; streak = me.streak || 0; hitSeen = (me.hit && me.hit.at) || 0; }
      else if (me.hit && me.hit.at !== hitSeen) {
        hitSeen = me.hit.at;
        if (data.status !== "finished") onHit(me.hit);
      }

      const list = ranked(data);
      renderMe(me, list.findIndex((p) => p.uid === currentUser.uid) + 1, list.length);
      renderStrip(list);
      renderItems(me);
      if (data.status !== "finished") detectEvents(data, list);
      if (!$("statsModal").classList.contains("hidden")) renderStats();

      if (data.status === "finished") return showGameOver(list, me);

      if (!data.fightStarted) {
        $("startOverlay").classList.remove("hidden");
        $("btnFight").classList.toggle("hidden", !isHost);
        $("waitHost").classList.toggle("hidden", isHost);
        return;
      }
      $("startOverlay").classList.add("hidden");
      if (!bgmWanted && !gameOverShown) startBgm();

      // Host menutup game saat semua pemain selesai / HP habis
      if (isHost && !finishing && list.length && list.every((p) => p.done)) {
        finishing = true;
        return finishGame(data);
      }

      const myIndex = me.qIndex || 0;
      if (me.done || (me.hp || 0) <= 0 || myIndex >= questions.length) {
        clearInterval(timerInterval);
        $("kanjiDisplay").textContent = (me.hp || 0) <= 0 ? "💀" : "✓";
        $("optionsGrid").innerHTML = "";
        $("pillText").textContent = "Selesai";
        const doneCount = list.filter((p) => p.done).length;
        $("qCount").textContent = `Menunggu pemain lain (${doneCount}/${list.length})`;
        $("btnEnd").classList.toggle("hidden", !isHost);
        if (!doneSent && !me.done) {
          doneSent = true;
          update(ref(db, `rooms/${roomId}/players/${currentUser.uid}`), { done: true, finishedAt: serverTimestamp() });
        }
        return;
      }
      if (myIndex !== shownIndex) { shownIndex = myIndex; loadQuestion(myIndex); }
    });
  });

  function renderQuestion(q, onPick) {
    const kanjiEl = $("kanjiDisplay");
    kanjiEl.textContent = q.kanji;
    const len = [...String(q.kanji)].length;
    kanjiEl.style.fontSize = len <= 2 ? "" : len <= 4 ? "clamp(44px, 15vw, 76px)" : len <= 6 ? "clamp(34px, 11vw, 56px)" : "clamp(26px, 8vw, 40px)";
    const grid = $("optionsGrid");
    grid.innerHTML = "";
    optsOf(q).forEach((opt, i) => {
      const b = document.createElement("button");
      b.type = "button";
      b.className = "btn-option jp";
      b.dataset.i = i;
      b.textContent = opt.text;
      b.onclick = () => onPick(i, !!opt.isCorrect);
      grid.appendChild(b);
    });
  }

  function loadQuestion(index) {
    isProcessing = false;
    const q = questions[index], info = qInfo(index);
    curSecs = info.boss ? 10 : 15;
    renderQuestion(q, selectAnswer);
    $("pillText").textContent = info.boss ? `👹 BOSS • EXP ×${3 + (info.final ? 1 : 0)} • 10 dtk` : q.retry ? "🔁 Ulangan — tadi kamu salah" : info.final ? "🔥 FINAL ROUND • EXP ×2" : "Pilih Cara Baca";
    $("qCount").textContent = `Soal ${index + 1} / ${questions.length}`;
    if (info.final && index === questions.length - finalN(questions.length)) announce("🔥 FINAL ROUND! Semua EXP ×2", "gold");
    if (info.boss) announce("👹 SOAL BOSS! Timer 10 detik, EXP besar", "red");
    renderCombo();
    resetTimer(handleTimeOut, curSecs);
  }

  function resetTimer(cb = handleTimeOut, secs = 15) {
    clearInterval(timerInterval);
    timeLeft = secs;
    const bar = $("timerBar");
    bar.style.transition = "none";
    bar.style.width = "100%";
    void bar.offsetWidth;
    bar.style.transition = "width 1s linear";
    timerInterval = setInterval(() => {
      timeLeft--;
      bar.style.width = `${(timeLeft / secs) * 100}%`;
      if (timeLeft <= 0) { clearInterval(timerInterval); cb(); }
    }, 1000);
  }

  function shake() {
    const m = $("arenaMain");
    m.classList.add("shake-anim");
    setTimeout(() => m.classList.remove("shake-anim"), 300);
  }

  function handleTimeOut() {
    if (isProcessing) return;
    isProcessing = true;
    const idx = shownIndex, q = questions[idx];
    play(sfxWrong); shake();
    const buttons = document.querySelectorAll(".btn-option");
    buttons.forEach((b) => (b.disabled = true));
    const ci = optsOf(q).findIndex((o) => o.isCorrect);
    if (btnAt(ci)) btnAt(ci).classList.add("btn-correct");
    streak = 0; renderCombo();
    showToast(q, "time");
    const base = `rooms/${roomId}/players/${currentUser.uid}`;
    const updates = {
      [`${base}/hp`]: increment(-1),
      [`${base}/streak`]: 0,
      [`${base}/qIndex`]: increment(1),
      [`${base}/history/${idx}`]: { kanji: q.kanji, furigana: correctText(q), arti: q.arti, picked: null, ok: false, timeout: true },
    };
    requeue(updates, base, idx, q);
    setTimeout(() => update(ref(db), updates), WRONG_DELAY);
  }

  function selectAnswer(index, isCorrect) {
    if (isProcessing || Date.now() < frozenUntil) return;
    isProcessing = true;
    clearInterval(timerInterval);
    const idx = shownIndex, q = questions[idx], o = optsOf(q);
    const buttons = document.querySelectorAll(".btn-option");
    buttons.forEach((b) => (b.disabled = true));
    const base = `rooms/${roomId}/players/${currentUser.uid}`;
    const updates = {}; let gain = 0, mult = 1;
    updates[`${base}/qIndex`] = increment(1);
    updates[`${base}/history/${idx}`] = { kanji: q.kanji, furigana: correctText(q), arti: q.arti, picked: o[index].text, ok: isCorrect, timeout: false };
    if (isCorrect) {
      play(sfxCorrect);
      btnAt(index).classList.add("btn-correct");
      // EXP = (20 + sisa detik) x (combo 1-3 + final +1 + boss +2)
      const info = qInfo(idx), fast = timeLeft >= curSecs * 0.8;
      mult = multOf(streak + 1) + (info.final ? 1 : 0) + (info.boss ? 2 : 0);
      gain = Math.round((20 + Math.max(0, timeLeft)) * mult);
      streak += 1;
      updates[`${base}/exp`] = increment(gain);
      updates[`${base}/streak`] = streak;
      if (streak >= 3) {                       // serangan otomatis: petir (streak 3-4) / bom (streak 5+)
        const bomb = streak >= 5, t = pickTarget();
        if (t) {
          const dmg = Math.min(bomb ? 15 : 5, t.exp || 0);
          showFx(sendAttack(updates, t, bomb ? "bomb" : "bolt", dmg), "out", t.name || "Lawan", dmg);
        }
      }
      if (streak === 3 || streak % 5 === 0 || (fast && Math.random() < 0.2)) giveItem(updates, base);   // item dari combo / jawaban cepat
      renderCombo();
    } else {
      play(sfxWrong);
      btnAt(index).classList.add("btn-wrong");
      updates[`${base}/hp`] = increment(-1);
      updates[`${base}/exp`] = increment(-5);
      streak = 0; updates[`${base}/streak`] = 0; renderCombo(); requeue(updates, base, idx, q);
      shake();
      const ci = o.findIndex((x) => x.isCorrect);
      if (btnAt(ci)) btnAt(ci).classList.add("btn-correct");
    }
    showToast(q, isCorrect ? "ok" : "bad", o[index].text);
    if (isCorrect) $("toastTitle").textContent = `✓ Benar! +${gain} EXP${mult > 1 ? ` (×${mult})` : ""}`;
    setTimeout(() => update(ref(db), updates), isCorrect ? OK_DELAY : WRONG_DELAY);
  }

  function showGameOver(list, me) {
    if (gameOverShown) return;
    gameOverShown = true;
    stopBgm();
    clearInterval(timerInterval);
    $("startOverlay").classList.add("hidden");
    $("gameOverOverlay").classList.remove("hidden");
    clearTimeout(toastTimer);
    $("toast").classList.add("hidden");
    const rank = list.findIndex((p) => p.uid === currentUser.uid) + 1;
    $("expResult").textContent = `Total EXP: ${me.exp || 0}`;
    $("winReason").textContent = `Peringkat ${rank} dari ${list.length} pemain`;
    $("finalBoard").innerHTML = boardHTML(list);
    $("btnCopyOver").classList.toggle("hidden", !isCustom());
    $("btnRematch").classList.toggle("hidden", !isHost);
    $("rematchWait").classList.toggle("hidden", isHost);
    const title = $("winnerText");
    if (rank === 1) { title.textContent = "JUARA 1! 🏆"; title.classList.add("text-yellow-400"); }
    else { title.textContent = `PERINGKAT ${MEDAL[rank - 1] || "#" + rank}`; title.classList.add("text-slate-200"); }
  }
</script>
</body>
</html>
